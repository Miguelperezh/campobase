<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102f28">
  <title>FútbolControl · Beta funcional aislada</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef2f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17211d}
    .lab-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#102f28;color:#fff;font-size:13px}
    .lab-banner strong{font-size:14px}.lab-banner span{opacity:.86}.frame{display:block;width:100%;height:2200px;border:0;background:#fff}
    @media(max-width:720px){.frame{height:2800px}.lab-banner{padding:8px 10px}}
  </style>
</head>
<body>
  <div class="lab-banner"><strong>FútbolControl · Beta funcional</strong><span>Copia completa de CampoBase · base local futbolcontrol-lab-v2 · Supabase real desactivado</span></div>
  <iframe id="fcapp" class="frame" src="index.html?v=fc-beta-v3" title="FútbolControl beta aislada"></iframe>
  <script>
    const frame=document.getElementById('fcapp');
    frame.addEventListener('load',()=>{
      const d=frame.contentDocument;if(!d)return;
      const unlock=()=>{try{const auth=d.querySelector('#auth-dialog');if(auth&&auth.open)auth.close();}catch(e){}d.body.classList.remove('auth-locked');};
      unlock();setTimeout(unlock,500);setTimeout(unlock,1200);
      if(!d.querySelector('script[data-fc-beta]')){
        const s=d.createElement('script');s.type='module';s.src='lab/beta-ui.js?v=3';s.dataset.fcBeta='true';d.body.appendChild(s);
      }
    });
  </script>
</body>
</html>
