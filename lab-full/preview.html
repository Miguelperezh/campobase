<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102f28">
  <title>FútbolControl · Beta funcional aislada</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17211d}
    body{display:flex;flex-direction:column;min-height:100dvh}
    .lab-banner{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 14px;background:#102f28;color:#fff;font-size:12px;line-height:1.25}
    .lab-banner strong{font-size:14px}.lab-banner span{opacity:.86}
    .frame{display:block;flex:1 1 auto;min-height:0;width:100%;border:0;background:#fff}
    @media(max-width:720px){.lab-banner{padding:7px 9px;font-size:11px}.lab-banner strong{font-size:13px}}
  </style>
</head>
<body>
  <div class="lab-banner"><strong>FútbolControl · Beta funcional</strong><span>Copia completa aislada · base local futbolcontrol-lab-v2 · Supabase real desactivado</span></div>
  <iframe id="fcapp" class="frame" src="index.html?v=fc-beta-v6" title="FútbolControl beta aislada"></iframe>
  <script>
    const frame=document.getElementById('fcapp');
    frame.addEventListener('load',()=>{
      const d=frame.contentDocument;if(!d)return;
      const autoLabLogin=()=>{
        const form=d.querySelector('#auth-form');
        const dialog=d.querySelector('#auth-dialog');
        if(!form||!dialog?.open)return false;
        const initial=!d.querySelector('#initial-pin-fields')?.classList.contains('hidden');
        if(initial){form.elements.newOwnerPin.value='7411';form.elements.newDelegatePin.value='8522';}
        else{form.elements.pin.value='7411';}
        form.requestSubmit();return true;
      };
      setTimeout(autoLabLogin,250);setTimeout(autoLabLogin,650);setTimeout(autoLabLogin,1200);
      const addModule=(src,key)=>{if(d.querySelector(`script[data-${key}]`))return;const s=d.createElement('script');s.type='module';s.src=src;s.dataset[key]='true';d.body.appendChild(s);};
      addModule('lab/beta-ui.js?v=5','fcBeta');
      setTimeout(()=>addModule('lab/beta-patches-v5-core.js?v=5','fcCore'),450);
      setTimeout(()=>addModule('lab/beta-patches-v5-session.js?v=5','fcSession'),650);
      setTimeout(()=>addModule('lab/beta-v6.js?v=6','fcV6'),900);
    });
  </script>
</body>
</html>
