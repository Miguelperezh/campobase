<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles-learning.css"><link rel="stylesheet" href="/styles-claude-proposal.css"><style>.view{display:none}.view.active{display:block}body{margin:0}</style><main id="app"></main><script type="module">
import {configureUserDatabase,getAll,getOne,put,putBatch} from '/js/db.js';
import {setBoundSaasUserId} from '/js/auth-manager.js';
import {initLearning} from '/js/learning-ui.js';
import {openClaudeColorEditor} from '/js/claude-color-editor.js?v=20261010-learning-1';
import {applyComponentColors} from '/js/theme-component-colors.js?v=20261009-postgame-sync-1';
const id=sessionStorage.learningTest||(sessionStorage.learningTest='learning-test-'+crypto.randomUUID());setBoundSaasUserId(id);configureUserDatabase(id);
const player={id:'p',name:'Jugador de prueba',number:3,positions:['Central']};const match={id:'m',opponent:'Rival de prueba',date:'2026-10-09',status:'finished',goalsFor:1,goalsAgainst:15,plan:{preserved:true},location:'Campo original'};
if(!await getOne('matches','m'))await putBatch({players:[player],matches:[match]});
let theme=(await getOne('settings','main'))?.theme||{};
window.__campobase={state:{role:'owner',players:[player],matches:[match],settings:{theme}},showView:()=>document.querySelector('#aprendizaje').classList.add('active')};
initLearning();window.__campobase.showView();
document.addEventListener('click',e=>{const b=e.target.closest('[data-theme-section]');if(b)openClaudeColorEditor({viewId:'aprendizaje',scope:document.getElementById(b.dataset.themeSection),title:'Aprendizaje',readTheme:()=>theme,applyTheme:applyComponentColors,saveTheme:async t=>{theme=t;window.__campobase.state.settings.theme=t;await put('settings',{id:'main',theme:t})}})});
window.learningFixture={getOne,getAll,put,theme:()=>theme};window.fixtureReady=true;
</script></html>
