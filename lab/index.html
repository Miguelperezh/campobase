<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FútbolControl · Laboratorio</title><link rel="stylesheet" href="lab.css"></head><body><header class="top"><div class="brand"><img src="futbolcontrol-logo.png" alt="FútbolControl"><div><span class="eyebrow">Laboratorio beta aislado</span><h1>FútbolControl</h1></div></div><span class="badge">Sin Supabase · datos ficticios</span></header><main><section class="hero"><div><span class="eyebrow">Nueva función 01</span><h2>Evolución individual del jugador</h2><p>Objetivos, evidencias y pruebas de posición en una única ficha. Esta pantalla no lee ni escribe datos reales.</p></div></section><section class="layout"><aside class="panel"><h3>Plantilla de prueba</h3><div id="players"></div></aside><section class="panel"><div id="detail"></div></section></section></main><dialog id="goalDialog"><form method="dialog" id="goalForm"><h3>Nuevo objetivo</h3><label>Objetivo<input name="text" required maxlength="120" placeholder="Ej. Reaccionar tras pérdida"></label><label>Categoría<select name="category"><option>Táctica</option><option>Técnica</option><option>Física</option><option>Actitud</option></select></label><label>Estado<select name="status"><option>Iniciado</option><option>Mejorando</option><option>Consolidado</option></select></label><menu><button value="cancel" class="secondary">Cancelar</button><button value="default" class="primary">Guardar</button></menu></form></dialog><dialog id="positionDialog"><form method="dialog" id="positionForm"><h3>Nueva prueba de posición</h3><label>Fecha<input name="date" type="date" required></label><label>Posición<input name="position" required placeholder="Ej. Delantero centro"></label><label>Contexto<select name="context"><option>Partido</option><option>Entrenamiento</option><option>Amistoso</option></select></label><label>Valoración<select name="rating"><option value="1">1/5</option><option value="2">2/5</option><option value="3" selected>3/5</option><option value="4">4/5</option><option value="5">5/5</option></select></label><label>Observación<textarea name="note" maxlength="220" placeholder="Qué funcionó o qué habría que revisar"></textarea></label><menu><button value="cancel" class="secondary">Cancelar</button><button value="default" class="primary">Guardar</button></menu></form></dialog><script src="lab.js"></script></body></html>
