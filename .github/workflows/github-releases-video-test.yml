name: CampoBase GitHub Releases video test

on:
  push:
    branches:
      - github-releases-video-test
    paths:
      - .github/workflows/github-releases-video-test.yml

permissions:
  contents: write

jobs:
  test-release-video:
    runs-on: ubuntu-latest
    env:
      TAG: campobase-video-storage-test-v1
      ASSET: library-v2-preview__pdf150-094__ejercicio.mp4
      SOURCE_URL: https://mdzpygfwugawlmknywxa.supabase.co/storage/v1/object/public/ejercicio-videos/library-v2-preview/pdf150-094/ejercicio.mp4

    steps:
      - name: Download one existing video from Supabase
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o "/tmp/$ASSET"
          SIZE="$(stat -c%s "/tmp/$ASSET")"
          echo "source_size=$SIZE"
          test "$SIZE" = "34993"

      - name: Create prerelease and upload MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "CampoBase video storage test"               --notes "Prueba técnica aislada de un MP4. No usar en producción hasta validar."               --prerelease               --latest=false
          fi

          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
          EXISTING_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"             --jq ".[] | select(.name == \"$ASSET\") | .id" | head -1 || true)"
          if [ -n "$EXISTING_ID" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$EXISTING_ID"
          fi

          curl -fL             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             -H "Content-Type: video/mp4"             "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET"             --data-binary "@/tmp/$ASSET"             -o /tmp/upload-response.json

          grep -q '"content_type":"video/mp4"' /tmp/upload-response.json

      - name: Verify bytes, Range and response time
        run: |
          set -euo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"

          curl -fL -D /tmp/full-headers.txt -o /tmp/full.mp4             -w "full_http=%{http_code} full_time=%{time_total} full_speed=%{speed_download}\n"             "$URL"
          test "$(stat -c%s /tmp/full.mp4)" = "34993"

          RANGE_HTTP="$(curl -sSL -D /tmp/range-headers.txt -o /tmp/range.bin             -w "%{http_code}" -H "Range: bytes=0-1023" "$URL")"
          RANGE_SIZE="$(stat -c%s /tmp/range.bin)"
          echo "range_http=$RANGE_HTTP range_size=$RANGE_SIZE"
          grep -iE '^(accept-ranges|content-range|content-type|content-disposition):' /tmp/range-headers.txt | tail -10 || true
          test "$RANGE_HTTP" = "206"
          test "$RANGE_SIZE" = "1024"

      - name: Install Playwright browsers
        run: |
          npm --prefix /tmp/campobase-video-browser-test init -y
          npm --prefix /tmp/campobase-video-browser-test install playwright@1.57.0
          cd /tmp/campobase-video-browser-test
          npx playwright install --with-deps chromium webkit

      - name: Test real HTML5 playback in Chromium and WebKit
        working-directory: /tmp/campobase-video-browser-test
        run: |
          cat > test-video.cjs <<'NODE'
          const { chromium, webkit } = require('playwright');

          async function test(engine, browserType) {
            const browser = await browserType.launch({ headless: true });
            const page = await browser.newPage();
            const result = await page.evaluate(async (url) => {
              const video = document.createElement('video');
              video.muted = true;
              video.playsInline = true;
              video.preload = 'metadata';
              document.body.appendChild(video);

              const waitEvent = (name, timeout = 15000) => new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error('timeout ' + name)), timeout);
                video.addEventListener(name, () => { clearTimeout(timer); resolve(); }, { once: true });
                video.addEventListener('error', () => {
                  clearTimeout(timer);
                  reject(new Error('media error ' + (video.error?.code || 'unknown') + ': ' + (video.error?.message || '')));
                }, { once: true });
              });

              video.src = url;
              video.load();
              await waitEvent('loadedmetadata');
              const duration = video.duration;
              await video.play();
              await new Promise(r => setTimeout(r, 500));
              const playedTime = video.currentTime;

              const seekTarget = Number.isFinite(duration) && duration > 0 ? Math.min(duration * 0.5, Math.max(0.1, duration - 0.1)) : 0.1;
              const seeked = waitEvent('seeked');
              video.currentTime = seekTarget;
              await seeked;

              return {
                duration,
                playedTime,
                seekTarget,
                currentTime: video.currentTime,
                readyState: video.readyState,
                networkState: video.networkState,
                videoWidth: video.videoWidth,
                videoHeight: video.videoHeight,
              };
            }, process.env.VIDEO_URL);

            console.log(engine, JSON.stringify(result));
            if (!(result.readyState >= 1)) throw new Error(engine + ': metadata not loaded');
            if (!(result.videoWidth > 0 && result.videoHeight > 0)) throw new Error(engine + ': no video dimensions');
            if (!(result.currentTime > 0)) throw new Error(engine + ': seek failed');
            await browser.close();
          }

          (async () => {
            await test('chromium', chromium);
            await test('webkit', webkit);
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE

          node test-video.cjs
