name: Mobile variants multi-video probe
on:
  push:
    branches:
      - fix/mobile-video-all-v39
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: node scripts/mobile-variants-multi-probe.mjs
