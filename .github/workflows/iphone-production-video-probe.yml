name: iPhone production PWA video probe
on:
  push:
    branches:
      - test/iphone-release-video
jobs:
  probe-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - run: node scripts/iphone-production-video-probe.mjs
