name: Catalog review export
on:
  push:
    paths:
      - '.github/workflows/catalog-review-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-review-source
          path: |
            library-v2/data/catalog.json
            assets/exercise-board/*.b64
          retention-days: 1
