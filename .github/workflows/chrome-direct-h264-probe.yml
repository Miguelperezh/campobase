name: Chrome direct H264 video probe
on:
  push:
    branches:
      - fix/mobile-video-fallback-v34
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: google-chrome --version
      - run: npm install --no-save playwright@1.55.0
      - run: node scripts/chrome-direct-h264-probe.mjs
