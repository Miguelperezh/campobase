name: Hotfix ejercicios MP4 lazy

on:
  push:
    branches:
      - hotfix/exercises-mp4-lazy
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
