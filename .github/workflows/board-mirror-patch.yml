name: Apply board material mirror
on:
  push:
    paths:
      - '.github/workflows/board-mirror-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch validated board asset
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, subprocess
          from pathlib import Path
          base='2a0c6b134126de5c706847504a90a8ce67196117'
