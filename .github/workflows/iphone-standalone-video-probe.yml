name: iPhone standalone video probe
on:
  push:
    branches:
      - test/iphone-standalone-video-v40

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: node scripts/iphone-standalone-video-probe.mjs
