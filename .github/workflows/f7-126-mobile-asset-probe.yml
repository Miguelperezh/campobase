name: f7-126 mobile asset probe
on:
  push:
    branches:
      - fix/mobile-video-f7-126-v34
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: node scripts/f7-126-mobile-asset-probe.mjs
