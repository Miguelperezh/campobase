  <script>
    (async () => {
      const {browserCacheContext, readViewCache, writeViewCache, cacheBelongsToAccount, sameViewAccount} = await import('./js/account-view-context.js?v=20261022-pilot-safety-1');
      const context = browserCacheContext();
      try {
        const cache = readViewCache(localStorage, 'campobase.directFieldCache', context);
        if (cacheBelongsToAccount(cache, context)) window.__CAMPOBASE_CACHE__ = cache;
      } catch {}

      if (typeof indexedDB === 'undefined') return;

      const tryReadDb = (name) => new Promise((resolve) => {
        try {
          const req = indexedDB.open(name);
          req.onsuccess = () => {
            const db = req.result;
            const stores = ['players', 'callups', 'matches', 'trainings', 'settings'];
            if (!stores.every((s) => db.objectStoreNames.contains(s))) {
              db.close();
              return resolve(null);
            }
            const tx = db.transaction(stores, 'readonly');
            const data = {};
            let count = 0;
            stores.forEach((s) => {
              const r = tx.objectStore(s).getAll();
              r.onsuccess = () => {
                data[s === 'trainings' ? 'attendance' : s] = r.result || [];
                count++;
                if (count === stores.length) {
                  db.close();
                  resolve(data.players && data.players.length > 0 ? data : null);
                }
              };
              r.onerror = () => { count++; if (count === stores.length) { db.close(); resolve(null); } };
            });
          };
          req.onerror = () => resolve(null);
        } catch {
          resolve(null);
        }
      });

      const loadFromStorage = async () => {
        const names = [context.database];
        for (const name of names) {
          const result = await tryReadDb(name);
          if (!sameViewAccount(context, browserCacheContext())) return;
          if (result && result.players && result.players.length > 0) {
            result.database = context.database; result.saasUserId = context.userId;
            window.__CAMPOBASE_CACHE__ = result;
            try { writeViewCache(localStorage, 'campobase.directFieldCache', result, context); } catch {}
            window.dispatchEvent(new CustomEvent('campobase:cache-ready', { detail: result }));
            break;
          }
        }
      };

      loadFromStorage();
    })();
  </script>

  <script>
    (() => {
      const REMOVE = new Set(['Grande, directo y sin menús innecesarios', 'Lo esencial a golpe de vista']);
      let queued = false;
      const cleanCopy = () => {
        queued = false;
        document.querySelectorAll('#hoy h2, #entrenos h2').forEach((heading) => {
          if (REMOVE.has(heading.textContent.trim())) heading.remove();
        });
      };
      const schedule = () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(cleanCopy);
      };
      schedule();
      new MutationObserver(schedule).observe(document.querySelector('.shell'), { childList: true, subtree: true });
    })();
  </script>
