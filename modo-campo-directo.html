<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a2d22">
  <title>CampoBase · Modo Campo</title>
  <link rel="stylesheet" href="./modo-campo-directo.css?v=3">
</head>
<body>
  <header class="top">
    <div class="brand"><div class="mark">CB</div><div><small>CampoBase · Uso en campo</small><h1>Modo Campo</h1></div></div>
    <div class="top-actions"><span id="sync" class="sync">Sincronizando…</span><a class="exit" href="./index.html">Salir Modo Campo</a></div>
  </header>

  <main class="shell">
    <section id="hoy" class="view active"></section>
    <section id="entrenos" class="view"></section>
    <section id="partidos" class="view"></section>
    <section id="delegado" class="view"></section>
    <section id="vivo" class="view"></section>
  </main>

  <nav class="bottom" aria-label="Modo Campo">
    <button class="nav active" data-nav="hoy"><span>⌂</span><strong>Hoy</strong></button>
    <button class="nav" data-nav="entrenos"><span>⚽</span><strong>Entrenos</strong></button>
    <button class="nav" data-nav="partidos"><span>🏟</span><strong>Partidos</strong></button>
    <button class="nav" data-nav="delegado"><span>👤</span><strong>Delegado</strong></button>
    <button class="nav" data-nav="vivo"><span>⏱</span><strong>En vivo</strong></button>
  </nav>

  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-head"><strong>Modo Campo</strong><button class="btn secondary" data-close-overlay>Volver</button></div>
    <div id="overlay-body" class="overlay-body"></div>
    <button class="close-bottom" data-close-overlay>Cerrar</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./vendor/supabase.js"></script>
  <script src="./js/modo-campo-directo.js?v=3"></script>
  <script src="./js/modo-campo-actions.js?v=1"></script>
</body>
</html>
